# ==========================================
# WORKOUT TRACKER - APPLICATION CONFIGURATION
# ==========================================

# ==========================================
# 1. Server Configuration
# ==========================================

server.port=${PORT:8080}


# ==========================================
# 2. MySQL Database Configuration
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/workout_tracker_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}


# ==========================================
# 3. JPA / Hibernate Configuration
# ==========================================

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Load related rows (sets, exercises, sessions) in batches instead of one
# query per row. The database is remote, so every query costs a round trip.
spring.jpa.properties.hibernate.default_batch_fetch_size=${JPA_BATCH_FETCH_SIZE:100}


# ==========================================
# 4. JWT Configuration
# ==========================================

workouttracker.app.jwtSecret=${JWT_SECRET}
# 30 days. The app renews the token when it is opened, so active users
# stay logged in.
workouttracker.app.jwtExpirationMs=${JWT_EXPIRATION_MS:2592000000}


# ==========================================
# 5. CORS Configuration
# ==========================================

workouttracker.app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}


# ==========================================
# 6. Admin Users
# ==========================================
# Comma-separated usernames allowed to edit / delete built-in exercises.

workouttracker.app.admin-usernames=${ADMIN_USERNAMES:}